name: Publish Quarto book

# Renders the Quarto book in docs/ and publishes it to the gh-pages
# branch, which GitHub Pages then serves. No Python/R needed: the pages are
# pure Markdown (no executable code cells), so only Quarto is required.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap gh-pages branch if missing
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists on origin; nothing to do."
          else
            echo "gh-pages not found on origin; creating orphan branch."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            tmp="$(mktemp -d)"
            git worktree add --detach "$tmp"
            cd "$tmp"
            git checkout --orphan gh-pages
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            printf 'Placeholder - replaced by Quarto on first publish.\n' > index.html
            touch .nojekyll
            git add index.html .nojekyll
            git commit -m "Initialize gh-pages branch"
            git push origin gh-pages
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}