name: Publish Quarto book

# Renders the Quarto book in docs/book and publishes it to the gh-pages
# branch, which GitHub Pages then serves. No Python/R needed: the pages are
# pure Markdown (no executable code cells), so only Quarto is required.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-book.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}