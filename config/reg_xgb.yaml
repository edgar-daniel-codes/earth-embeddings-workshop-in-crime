model: reg_xgb
params:
  family: poisson       # poisson | negbin | hurdle (zero-inflated two-part)
  alpha: 1.0            # NB2 overdispersion (family: negbin)
  num_boost_round: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0

tuning:
  n_trials: 40
  metric: poisson_deviance    # minimized
  space:
    family:           {type: categorical, choices: [poisson, negbin, hurdle]}
    alpha:            {type: float, low: 0.1,  high: 5.0,  log: true}
    max_depth:        {type: int,   low: 2,    high: 8}
    learning_rate:    {type: float, low: 0.01, high: 0.3,  log: true}
    num_boost_round:  {type: int,   low: 100,  high: 800}
    subsample:        {type: float, low: 0.5,  high: 1.0}
    min_child_weight: {type: float, low: 1.0,  high: 20.0, log: true}
