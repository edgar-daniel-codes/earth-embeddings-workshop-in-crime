# cluster_pipeline configuration
# All fields under `data` and `model` are required; `viz.palette` and
# `output` fall back to sensible defaults if omitted.

data:
  parquet_path: "./data/proc/training_sets/cdmx_asaltos.parquet"
  feature_columns:
    - A00
    - A01
    - A02
    - A03
    - A04
    - A05
    - A06
    - A07
    - A08
    - A09
    - A10
    - A11
    - A12
